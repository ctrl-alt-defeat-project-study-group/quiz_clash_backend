services:
  - type: web
    name: quizclash-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: quizclash-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: FRONTEND_ORIGINS
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_NAME
        value: QuizClash
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: OAUTH_REDIRECT_BASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: quizclash-db
    databaseName: quizclash
    user: quizclash
    plan: free
